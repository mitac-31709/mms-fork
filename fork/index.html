<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meister Management System</title>

<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip-link" href="#main">本文へスキップ</a>

<!-- ログイン。元アプリの Devise にそのまま中継する。 -->
<main class="signin" id="signin" hidden>
  <div class="signin__card">
    <p class="signin__eyebrow">Meister Management System</p>
    <h1 class="signin__title">ログイン</h1>
    <p class="signin__lede">
      元アプリのアカウントでログインします。メールアドレスとパスワードは
      <code>meister.tokyo-ct.org</code> にそのまま中継され、この画面側には保存しません。
    </p>

    <form class="signin__form" id="signin-form" novalidate>
      <div class="field">
        <label class="field__label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" name="email"
               autocomplete="username" placeholder="s12345@tokyo.kosen-ac.jp"
               required aria-describedby="email-hint">
        <p class="field__hint" id="email-hint">&nbsp;</p>
      </div>

      <div class="field">
        <label class="field__label" for="password">パスワード</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required aria-describedby="password-hint">
        <p class="field__hint" id="password-hint">&nbsp;</p>
      </div>

      <p class="signin__error" id="signin-error" role="alert" hidden></p>

      <button class="btn btn--primary signin__submit" type="submit" id="signin-submit">
        ログイン
      </button>
    </form>

    <p class="signin__foot">
      パスワードを忘れた場合は
      <a href="https://meister.tokyo-ct.org/users/password/new" target="_blank" rel="noopener">
        元アプリの再設定画面</a>から手続きしてください。
      アカウントが必要な方は管理者にお問い合わせください。
    </p>
    <p class="signin__foot">
      ログインせずに画面の作りとキャッシュ挙動を見るなら
      <a href="?demo=1" id="signin-demo">デモデータで開く</a>。
    </p>
  </div>
</main>

<div class="app" id="app" hidden>

  <!-- N3 サイドレール。1024px 未満では上部バー + シートになる。 -->
  <header class="rail" id="rail">
    <div class="rail__top">
      <a class="wordmark" href="/dashboard" data-route="/dashboard">MMS</a>
      <button class="rail__toggle" type="button" id="nav-toggle"
              aria-expanded="false" aria-controls="rail-nav">
        <span class="rail__toggle-bars" aria-hidden="true"></span>
        <span class="sr-only">メニューを開く</span>
      </button>
    </div>

    <nav class="rail__nav" id="rail-nav" aria-label="メインナビゲーション">
      <ul class="rail__list" id="rail-list">
        <li><a class="rail__link" href="/dashboard" data-route="/dashboard">ダッシュボード</a></li>
        <li><a class="rail__link" href="/reports" data-route="/reports">週報</a></li>
        <li><a class="rail__link" href="/orders" data-route="/orders">注文</a></li>
        <li><a class="rail__link" href="/equipments" data-route="/equipments">機材</a></li>
        <li><a class="rail__link" href="/loans" data-route="/loans">貸出</a></li>
      </ul>

      <div class="rail__foot">
        <a class="rail__link rail__link--quiet" href="/notifications" data-route="/notifications">
          通知
          <span class="badge" id="notification-badge" hidden></span>
        </a>
        <p class="rail__user">
          <span class="rail__user-name" id="user-name"></span>
          <span class="rail__user-meta" id="user-meta"></span>
        </p>
        <button class="rail__link rail__link--quiet" type="button" id="mode-switch" hidden>
          TAビューへ
        </button>
        <button class="rail__link rail__link--quiet" type="button" id="logout">
          ログアウト
        </button>
        <p class="colophon">MMS — UI 改善フォーク</p>
      </div>
    </nav>
  </header>

  <main class="main" id="main">
    <!-- データの出どころ。実データとデモを取り違えないよう全画面で出す。 -->
    <div class="datasource" id="data-source" hidden>
      <span class="datasource__note" id="data-source-note"></span>
      <button class="datasource__refresh" type="button" id="data-source-refresh"
              aria-busy="false">
        更新
      </button>
    </div>
    <div id="view" class="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- 詳細スライドオーバー。中身は画面ごとに差し替える。 -->
<aside class="panel" id="panel" role="dialog" aria-modal="true"
       aria-labelledby="panel-title" hidden>
  <header class="panel__head">
    <p class="panel__eyebrow" id="panel-eyebrow"></p>
    <h2 class="panel__title" id="panel-title"></h2>
    <button class="icon-btn" type="button" id="panel-close">
      <span aria-hidden="true">✕</span>
      <span class="sr-only">閉じる</span>
    </button>
  </header>
  <div class="panel__body" id="panel-body"></div>
  <footer class="panel__foot" id="panel-foot"></footer>
</aside>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js"></script>
</body>
</html>
